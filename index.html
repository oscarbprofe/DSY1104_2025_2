<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página moderna</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="index.css">
  <style>
    html {
      font-size: 16px;
      /* Base font size - 1rem = 16px */
    }

    body {
      padding: 2rem;
      /* 32px padding */
      margin: 0;
    }
  </style>
  <script>
    console.log("Hola mundo!");
    var num1 = 1;  // Variable inerente a la función y puede ser leída de afuera 
    let num2 = 2;
    const num3 = 3;
    console.log(document);
  </script>
</head>

<body>
  <header>
    <h1>Mi Sitio</h1>
    <nav>
      <div id="nav-bar" class="nav-container">
        <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links">
          <a href="/">Inicio</a>
          <a href="/blog">Blog</a>
          <a href="/servicios">Servicios</a>
          <a href="/contacto">Contacto</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <article>
      <header class="article_header">
        <h2>Título de artículo</h2>
      </header>
      <p>Texto del artículo...</p>
    </article>
    <div class="circle"></div>
    <button onclick="cambiarFondoNavBar()">Cambiar fondo del nav-bar</button>
    <button onclick="restaurarFondoNavBar()">Restaurar fondo del nav-bar</button>
    <div id="personas-container"></div>
  </main>

  <aside>
    <h3>Noticias relacionadas</h3>
    <p>Contenido adicional...</p>
  </aside>

  <footer>
    <p>© 2025 Mi Sitio</p>
  </footer>

  <script src="script.js"></script>
  <script>
    if(2 === '2'){
      console.log("2 es igual a '2' con coerción de tipo");
    } else {
      console.log("2 no es igual a '2'");
    }
    console.log('2' + '2')

  </script>
  <script>
    // Cambia el background de #nav-bar
    function cambiarFondoNavBar() {
      var navbar = document.getElementById('nav-bar');
      if (navbar) {
        navbar.style.background = '#3498db'; // color azul moderno
      }
    };
  </script>
</body>

</html>
